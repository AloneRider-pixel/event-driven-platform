version: "3.9"

services:
  # ─── Infrastructure ───
  
  postgres:
    image: postgres:16-alpine
    container_name: edp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: edp-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: edp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: edp-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ─── Application Services ───

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: edp-api-gateway
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./api-gateway:/app
      - ./shared:/app/shared
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: edp-order-service
    env_file: .env
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./order-service:/app
      - ./shared:/app/shared
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: edp-payment-service
    env_file: .env
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./payment-service:/app
      - ./shared:/app/shared
    command: >
      bash -c "python consumer.py &
      uvicorn main:app --host 0.0.0.0 --port 8002 --reload"

  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: edp-inventory-service
    env_file: .env
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./inventory-service:/app
      - ./shared:/app/shared
    command: >
      bash -c "python consumer.py &
      uvicorn main:app --host 0.0.0.0 --port 8003 --reload"

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: edp-notification-service
    env_file: .env
    ports:
      - "8004:8004"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./notification-service:/app
      - ./shared:/app/shared
    command: >
      bash -c "python consumer.py &
      uvicorn main:app --host 0.0.0.0 --port 8004 --reload"

volumes:
  postgres_data:
