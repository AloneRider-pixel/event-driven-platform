name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Dependency Graph
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Review dependency changes
        if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1

      - name: Transparent skip
        if: steps.graph.outputs.enabled != 'true'
        run: echo "::notice::Dependency Review skipped because GitHub Dependency Graph is disabled for this repository. Enable it in Settings > Security & analysis to activate the gate."
